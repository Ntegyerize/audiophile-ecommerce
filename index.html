<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/components/header.css">
    <link rel="stylesheet" href="./styles/components/buttons.css">
    <link rel="stylesheet" href="./styles/pages/home.css">
    <title>Audiophile | Home</title>
</head>
<body>
<div class="home-top">

    <!-- Decorative hero artwork -->
  <div class="home-top__background" aria-hidden="true">

  <!-- Desktop artwork -->
  <div class="home-top__artwork home-top__artwork--desktop">
    <img src="./assets/hero-desktop.png" alt="">
  </div>

  <!-- Tablet artwork -->
  <div class="home-top__artwork home-top__artwork--tablet">
    <img src="./assets/hero-tablet-mobile.png" alt="">
  </div>

  <!-- Mobile artwork -->
  <div class="home-top__artwork home-top__artwork--mobile">
    <img src="./assets/hero-tablet-mobile.png" alt="">
  </div>

</div>
    <!-- Existing semantic header -->
    <header class="site-header">
      <div class="site-header__container">

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <a
          href="index.html"
          class="site-header__logo"
          aria-label="Audiophile home"
        >
          <img src="assets/audiophile-logo.svg" alt="">
        </a>

        <nav
          class="site-navigation"
          aria-label="Main navigation"
        >
          <a href="index.html">Home</a>
          <a href="headphones.html">Headphones</a>
          <a href="speakers.html">Speakers</a>
          <a href="earphones.html">Earphones</a>
        </nav>

        <a
          href="cart.html"
          class="site-header__cart"
          aria-label="Shopping cart"
        >
          <img src="assets/icon-cart.svg" alt="">
        </a>

      </div>
    </header>

    <main>
      <section class="home-hero">

        <div class="home-hero__container">

          <div class="home-hero__content">

            <p class="home-hero__eyebrow">
              New Product
            </p>

            <h1 class="home-hero__title">
              <span>XX99 Mark II</span>
              <span>Headphones</span>
            </h1>

            <p class="home-hero__description">
              Experience natural, lifelike audio and exceptional
              build quality made for the passionate music enthusiast.
            </p>

            <a
              href="./product-xx99-mark-two-headphones.html"
              class="button button--primary"
            >
              See Product
            </a>

          </div>

        </div>

      </section>
    </main>

  </div>

</body>
</html>
